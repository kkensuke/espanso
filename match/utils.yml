matches:
  - trigger: ";local"
    replace: "localhost:3000/"

# --- Invert PDF in VScode ---
  - trigger: ";invert"
    replace: "{{output}}"
    vars:
      - name: path
        type: echo
        params:
          echo: "{{DOTFILES}}/vscode/settings.json"
      - name: output
        type: shell
        params:
          cmd: |
            if grep -q "\"latex-workshop.view.pdf.invert\": 1" {{path}};
            then sed -i '' 's/\"latex-workshop.view.pdf.invert\": 1/\"latex-workshop.view.pdf.invert\": 0/' {{path}};
            elif grep -q "\"latex-workshop.view.pdf.invert\": 0" {{path}};
            then sed -i '' 's/\"latex-workshop.view.pdf.invert\": 0/\"latex-workshop.view.pdf.invert\": 1/' {{path}};
            else echo "No matching pattern found.";
            fi

# --- Speak Clipboard Content ---
  - trigger: ";speak"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "osascript -e 'say \"{{clipboard}}\"'"

# ——— Shorten Clipboard URL ———
# Use shell extension to avoid that symbols like &,# are interpreted by shell, which would cause an error.
  - trigger: ";short"
    replace: "{{short_url}}"
    vars:
      - name: short_url
        type: script
        params:
          args:
            - curl
            - --fail
            - --silent
            - --show-error
            - --location
            - --max-time
            - "15"
            - --get
            - --data-urlencode
            - "url={{clipboard}}"
            - "https://tinyurl.com/api-create.php"

# --- Currency Conversion ---
  - trigger: ";ccv"
    replace: "{{conversion}}"
    vars:
      - name: form
        type: form
        params:
          layout: |
                  Amount: [[amount]]
                  From: [[from]]
                  To: [[to]]
          fields:
            amount:
              default: "100"
            from:
              type: choice
              values: ["USD", "JPY", "CHF", "EUR", "CNY", "KRW", "CAD", "AUD", "SGD", "HKD", "TWD"]
            to:
              type: choice
              values: ["JPY", "USD", "EUR", "CHF", "CNY", "KRW", "CAD", "AUD", "SGD", "HKD", "TWD"]
      - name: conversion
        type: shell
        params:
          cmd: "curl -s 'https://api.exchangerate-api.com/v4/latest/{{form.from}}' | jq -r '.rates.{{form.to}} * {{form.amount}} | round * 100 / 100' | xargs printf '{{form.amount}} {{form.from}} = %.2f {{form.to}}\\n'"
