matches:

# --- Echo ---
  - trigger: ";echo"
    replace: "{{output}}"
    vars:
      - name: output
        type: echo
        params:
          echo: "Hello, World!"

# --- Shell Execution ---
  - trigger: ";shell"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "echo 'This is a shell command output.'"

# --- Script Execution ---
# Since each element of `args` becomes an individual argument, even values containing spaces or quotes are not re-interpreted as a shell command string. On the other hand, `|`, `>`, `&&`, `;`, `~` expansion, `$VAR` expansion, etc., cannot be used.
  - trigger: ";example"
    replace: "{{output}}"
    vars:
      - name: output
        type: script
        params:
          args:
            - open
            - -a
            - "Google Chrome"
            - "https://example.com/"

  - trigger: ";python"
    replace: "{{output}}"
    vars:
      - name: output
        type: script
        params:
          args:
            - python3
            - -c
            - |
                import sys
                value = sys.argv[1].encode("utf-8")
                print("This is a script output. You can use Python to process the input, such as clipboard content or other variables. The clipboard content: " + value.decode("utf-8"))
            - "{{clipboard}}"

# ——— Get IP Address ———
  - trigger: ";myip"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "curl -s 'https://ipinfo.io' | jq -r '\"IP: \" + .ip + \"\nLocation: \" + .city + \", \" + .region + \", \" + .country + \"\nISP: \" + .org'"

# ——— Generate Random Number ———
  - trigger: ";dice"
    replace: "{{roll}}"
    vars:
      - name: roll
        type: shell
        params:
          cmd: "shuf -i 1-6 -n 1"

# ——— Generate UUID ———
  - trigger: ";uuid"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "uuidgen"

# ——— Generate Password ———
  - trigger: ";genpw"
    replace: "{{output}}"
    vars:
      - name: length
        type: echo
        params:
          echo: "25" # must be string
      - name: output
        type: shell
        params:
          # macOS/Linux with /dev/urandom
          cmd: "head /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9!@#$%^&*' | head -c {{length}}; echo ''"

  - trigger: ";secpw"
    replace: "{{password}}"
    vars:
      - name: form
        type: form
        params:
          layout: |
            Length: [[length]]
            Include Symbols: [[symbols]]
          fields:
            length:
              default: "20"
              type: choice
              values: ["16", "20", "24"]
            symbols:
              type: choice
              values: ["Yes", "No"]
      - name: password
        type: shell
        params:
          cmd: |
            if [ "{{form.symbols}}" = "Yes" ]; then
              LC_ALL=C tr -dc 'A-Za-z0-9!@#$%^&*' < /dev/urandom | head -c {{form.length}}
            else
              LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c {{form.length}}
            fi

# ——— Generate hash ———
  - trigger: ";hash"
    replace: "{{output}}"
    vars:
      - name: output
        type: script
        params:
          args:
            - python3
            - -c
            - |
                import hashlib
                import sys
                value = sys.argv[1].encode("utf-8")
                print(hashlib.sha256(value).hexdigest())
            - "{{clipboard}}"

# --- Random excuse generator ---
  - trigger: ";excuse"
    replace: "{{output}}"
    vars:
      - name: output
        type: random
        params:
          choices:
            - "My cat walked on the keyboard."
            - "The cosmic rays flipped a bit."
            - "It works on my machine."
            - "That's a feature, not a bug."
            - "The cache needs to be cleared."
            - "DNS propagation issues."
            - "Mercury is in retrograde."
            - "I was distracted by a squirrel."
            - "I forgot to save my changes."
            - "I was testing your patience."
