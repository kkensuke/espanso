global_vars:
  - name: "open_with_vscode"
    type: echo
    params:
      echo: "if [[ -e {{path}} ]]; then open -a Ghostty; echo 'code {{path}}'; fi"
          # following commands deletes some letters from the file when you open it
          # cmd: "code {{path}}"

matches:
# --- Open applications ---
  - trigger: ";tml"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "open -a Ghostty"

# --- Open files, or directories ---
  - trigger: ";espanso"
    replace: "{{output}}\n"
    vars:
      - name: path
        type: echo
        params:
          echo: "{{ESPANSO}}"
      - name: output
        type: shell
        params:
          cmd: "{{open_with_vscode}}"

  - trigger: ";quant"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "open {{GITHUB}}/qc/"

# --- Select and open a directory in github/ ---
  - trigger: ";cdgh"
    replace: "{{output}}\n"
    vars:
      - name: available
        type: shell
        params:
          cmd: "ls {{GITHUB}}/"
      - name: "form"
        type: form
        params:
          layout: "GitHub Repo Name : [[repo_name]]"
          fields:
            repo_name:
              type: choice
              values: "{{available}}"
      - name: path
        type: echo
        params:
          echo: "{{GITHUB}}/{{form.repo_name}}"
      - name: output
        type: shell
        params:
          cmd: "{{open_with_vscode}}"
